name = "horizon-app-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
WEBSITE_BASE_URL = "https://www.horizoncommunity.church"
CHURCH_CENTER_BASE_URL = "https://horizoncommunitychurch.churchcenter.com"

# Secrets (set with `wrangler secret put <NAME>`):
#   PCO_APP_ID   – Planning Center Personal Access Token application id (org admin account)
#   PCO_SECRET   – Planning Center Personal Access Token secret

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: Horizon
options:
  bundleIdPrefix: church.horizoncommunity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID
targets:
  Horizon:
    type: application
    platform: iOS
    sources: [Horizon]
    info:
      path: Horizon/Resources/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        CFBundleURLTypes:
          - CFBundleURLName: church.horizoncommunity.app
            CFBundleURLSchemes: [horizonchurch]
        UILaunchScreen:
          UIColorName: BrandNavy
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: "Horizon uses your location to offer check-in when you arrive on campus and to show groups near you."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Allow Horizon to remind you to check in when you arrive on campus."
        NSCalendarsWriteOnlyAccessUsageDescription: "Add Horizon events and serving dates to your calendar."
        NSPhotoLibraryUsageDescription: "Choose a profile photo."
        NSCameraUsageDescription: "Take a profile photo."
        HorizonAPIBaseURL: "$(HORIZON_API_BASE_URL)"
        PCOClientID: "$(PCO_CLIENT_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: church.horizoncommunity.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        HORIZON_API_BASE_URL: "https://horizon-app-api.example.workers.dev"
        PCO_CLIENT_ID: "REPLACE_WITH_PCO_OAUTH_CLIENT_ID"
  HorizonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HorizonTests]
    dependencies:
      - target: Horizon
schemes:
  Horizon:
    build:
      targets:
        Horizon: all
        HorizonTests: [test]
    test:
      targets: [HorizonTests]
